name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe_dict.py
      - run: |
          curl -sSL -m 120 -o k.ods -w "%{http_code} %{size_download}\n" https://sutian.moe.edu.tw/sujip/kautian.ods || true
          ls -la k.ods; file k.ods
          pip install odfpy pandas >/dev/null 2>&1
          python3 - <<'PY'
          import pandas as pd
          x=pd.read_excel('k.ods',engine='odf',sheet_name=None,nrows=3)
          for k,v in x.items(): print(k,list(v.columns)); print(v.head(3).to_string()[:1500])
          PY
