name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe.py | tail -3
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add tools/_cand.json && git commit -qm "probe data" && git pull --rebase -q && git push
