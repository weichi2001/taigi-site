name: refresh-pts
on:
  schedule: [{cron: '0 */8 * * *'}]
  workflow_dispatch:
  push:
    paths: ['tools/**']
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_pts.py
        continue-on-error: true
      - run: python3 tools/fetch_yt.py
        continue-on-error: true
      - run: |
          git config user.name "pts-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "refresh data" && git push)
