name: refresh-dict
on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * 0'
  push:
    paths: ['tools/fetch_dict.py']
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install odfpy pandas
      - run: python3 tools/fetch_dict.py
      - run: |
          ls -la dict.json ex.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "refresh dict" && git pull --rebase -q && git push
