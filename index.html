<style>

.steps{counter-reset:s}div.steps{padding-left:0;margin:6px 0 0;font-size:inherit;line-height:inherit}.step>h3{margin:0;padding-left:44px;min-height:32px;display:flex;align-items:center}.step>.sub{margin:10px 0 14px}.step .res{margin:10px 0}.step .dash{margin:10px 0 8px}

.step::before{counter-increment:s;content:counter(s);position:absolute;left:20px;top:18px;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.app{padding:14px 16px}

.app .desc{margin:2px 0 8px;color:var(--ink2);font-size:14px}

.ime-h,.res.ap{display:flex;gap:12px;align-items:center}.aic{width:68px;height:68px;border-radius:16px;box-shadow:0 1px 3px rgba(97,80,69,.18);flex:none;object-fit:cover;background:#efe4cf;display:flex;align-items:center;justify-content:center;font-size:34px}.res.ap>div{min-width:0}.res.ap{align-items:flex-start}.ime-h p{margin:2px 0 0;color:var(--ink2);font-size:14px}.kick2{font-family:Huninn,"Noto Sans TC",sans-serif;font-size:19px;font-weight:700}.ime .tabs{margin:12px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.ime .tabs .fb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:12px;font-size:13px}.ime .tabs .ic{display:block}.ime .dl{display:block;text-align:center}.steps{margin:14px 0 0;padding-left:22px;font-size:14.5px;line-height:1.7}.tip{margin:12px 0 0;padding:8px 10px;border-radius:10px;background:var(--badbg);font-size:13px}.sec{font-size:15px;color:var(--ink2);margin:6px 0 0}.ime .note{margin:14px 0 0}.res .plat{margin-top:6px}

.plat .btn{flex:1 1 0;min-width:0;text-align:center;padding:8px 6px;white-space:nowrap}
.note{font-size:13px;color:var(--ink2)}

.eps{margin-top:14px}.eps>b{display:block;margin-bottom:8px}
.ess{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.ess button{background:#2c2622;color:#f1e9dd;border:1px solid #3a322c;border-radius:14px;padding:3px 11px;font:inherit;font-size:13px;cursor:pointer}.ess button.on{background:#e24403;border-color:#e24403}

function openPop(url){
  // 在 claude.ai 的 artifact 裡（沙箱 iframe）彈窗會被辭典的 COOP 擋下，直接走一般連結
  try{if(window.origin==='null'||window.top!==window)return false}catch(_){return false}
  const wide=window.innerWidth>=800&&!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
  if(!wide)return false;
  try{
    const left=Math.max(0,(screen.availLeft||0)+screen.availWidth-480),top=(screen.availTop||0)+40;
    const w=window.open(url,'tgdict','popup=yes,width=460,height=740,left='+left+',top='+top);
    if(w){try{w.focus()}catch(_){}return true}
  }catch(_){}
  return false;
}

}

// ---- 700 字 ----
function filt(){
  const k=norm(S.q);
  const F={all:()=>1,b1:o=>o.b.includes(1),b2:o=>o.b.includes(2),b3:o=>o.b.includes(3),bad:o=>get(o.n)==2,ok:o=>get(o.n)==1,x:o=>o.x.length>0};
  return D.filter(o=>(!k||o.k.includes(k))&&(F[S.f]||F.all)(o));
}
function bodyW700(){
  if(!S.q&&S.f==='all'){
    return `<div class="segs">${Array.from({length:NSEG},(_,i)=>i+1).map(s=>{
      const k=segKnown(s),n=segItems(s).length;
      return `<a class="seg" href="#seg${s}"><b class="hd">${String(s).padStart(2,'0')}</b><span>編號 ${segRange(s)}</span><em>${esc(segLabel(s))}</em><i class="bar"><u style="width:${k/n*100}%"></u></i><small>會了 ${k} / ${n}</small></a>`}).join('')}</div>`;
  }
  const r=filt();
  if(!r.length)return `<div class="empty">找不到符合的字</div>`;
  return `<p class="note">找到 ${r.length} 個字</p>${r.slice(0,S.more).map(row).join('')}${r.length>S.more?`<div class="acts" style="justify-content:center"><button class="btn" data-act="more">再看更多</button></div>`:''}`;
}
function pW700(){
  const known=D.filter(o=>get(o.n)==1).length,bad=D.filter(o=>get(o.n)==2).length;
  const FL=[['all','全部'],['b1','第一冊'],['b2','第二冊'],['b3','第三冊'],['bad','不熟'],['ok','會了'],['x','有常見錯寫']];
  return `<a class="back" href="#home">← 首頁</a><h2 class="hd">700 字自學</h2>
   <p class="sub">教育部《臺灣台語推薦用字 700 字表》，照原表順序。每段 ${SEG} 字，可以從任何一段開始。</p>
   <div class="card"><b>你已經會了 ${known} / ${D.length} 個字</b><i class="bar"><u style="width:${known/D.length*100}%"></u></i>
    <div class="acts"><a class="btn pri ${bad?'':'off'}" href="#review">複習不熟的字（${bad}）</a><a class="btn" href="#quiz">挑錯字挑戰</a></div></div>
   <input type="search" id="q" placeholder="搜尋：漢字、台羅、華語都可以（例：舅媽、a-kim）" value="${esc(S.q)}" autocomplete="off">
   <div class="filters">${FL.map(([k,l])=>`<button class="fb ${S.f===k?'on':''}" data-act="filt" data-f="${k}">${l}</button>`).join('')}</div>
   <div id="body">${bodyW700()}</div>`;
}
function pSeg(s){
  if(s<1||s>NSEG)return `<div class="empty">沒有這一段</div>`;
  const items=segItems(s),k=segKnown(s);
  const tabs=[['list','瀏覽'],['flip','翻卡自測'],['quiz','挑錯字']];
  let body='';
  if(S.mode==='list')body=items.map(row).join('');
  else if(S.mode==='flip')body=flipHtml();
  else body=quizHtml();
  return `<a class="back" href="#w700">← 700 字</a><h2 class="hd">第 ${s} 段　<span class="note">編號 ${segRange(s)}</span></h2>
   <i class="bar"><u style="width:${k/items.length*100}%"></u></i><p class="note">會了 ${k} / ${items.length}</p>
   <div class="tabs">${tabs.map(([m,l])=>`<button class="fb ${S.mode===m?'on':''}" data-act="mode" data-m="${m}">${l}</button>`).join('')}</div>
   ${body}
   <div class="acts" style="justify-content:space-between;margin-top:16px">
    ${s>1?`<a class="btn" href="#seg${s-1}">← 上一段</a>`:'<span></span>'}${s<NSEG?`<a class="btn" href="#seg${s+1}">下一段 →</a>`:'<span></span>'}</div>`;
}
function pReview(){
  return `<a class="back" href="#w700">← 700 字</a><h2 class="hd">複習不熟的字</h2>${flipHtml()}`;
}
function pQuiz(){
  return `<a class="back" href="#w700">← 700 字</a><h2 class="hd">挑錯字挑戰</h2>
   <p class="sub">每題兩個寫法，選出教育部推薦用字。</p>${quizHtml()}`;
}

const fab=$('#fab'),mini=$('#mini'),mq=$('#mq'),mb=$('#mb');

let DX=null,DXS='idle',EXD=null,mlim=30;
const hasHan=s=>/\p{Script=Han}/u.test(s), clean=s=>s.replace(/【[^】]*】/g,'');
function dxLoad(){
  if(DXS!=='idle')return;DXS='load';
  fetch('dict.json',{cache:'no-cache'}).then(r=>r.ok?r.json():Promise.reject()).then(a=>(a[0]&&a[0][5][0]&&a[0][5][0][2]===undefined)?fetch('dict.json',{cache:'reload'}).then(r=>r.json()):a).then(a=>{

}
// 華語查詢：解釋裡整段剛好等於查詢字（如「知道、懂得。」的「知道」）排最前，越前面的義項、義項越少越優先
function gl(e,raw){
  let best=4;
  e.s.forEach(([p,d],i)=>{
    d.split(/[、，；,;。]/).forEach((g,j)=>{
      g=g.replace(/[（(].*?[）)]/g,'').trim();
      if(!g.includes(raw))return;
      const v=(g===raw?1.5:g.startsWith(raw)||g.endsWith(raw)?2.6:3.6)+i*0.04+j*0.05+e.s.length*0.005+(/^【文】/.test(e.r)?0.1:0)-(inW700.has(e.hc)?0.03:0);
      if(v<best)best=v;
    });
  });
  return best;
}
// 華語單字 → 台語常用字（吃→食）：用「解釋剛好是這個字」的單字詞目，取最前面的義項
const CM={};
function cmap(c){
  if(c in CM)return CM[c];
  if(DX.some(e=>e.hc===c))return CM[c]=c;
  let best=null,bs=9;
  for(const e of DX){if(e.hc.length!==1||e.hc===c)continue;
    e.s.forEach(([p,d],i)=>d.split(/[、，；,;。]/).forEach((g,j)=>{if(g.trim()!==c)return;
      const v=i*0.04+j*0.02+(/^【文】/.test(e.r)?0.1:0)-(inW700.has(e.hc)?0.1:0);if(v<bs){bs=v;best=e.hc}}))}
  return CM[c]=best||c;
}
function dxFind(raw){
  const k=norm(raw),han=hasHan(raw),out=[];
  const tr=han&&raw.length>=2?[...raw].map(cmap).join(''):raw;
  for(const e of DX){
    let sc=9;
    if(han){
      if(e.hc===raw)sc=0;else if(e.hc.startsWith(raw))sc=1;else if(e.hc.includes(raw))sc=2;else if(e.v.some(x=>clean(x[0]).includes(raw)))sc=3;else if(e.d.includes(raw))sc=gl(e,raw);
      if(tr!==raw&&sc>2){if(e.hc===tr)sc=1.6;else if(e.hc.startsWith(tr))sc=1.7;else if(e.hc.includes(tr))sc=1.9}
    }else if(k){
      if(e.ks.includes(k))sc=0;else if(e.ks.some(x=>x.startsWith(k)))sc=1;else if(e.k.includes(k))sc=2;
    }
    if(sc===9&&han&&EXD){const L=EXD[e.id];if(L&&L.some(x=>x[2].includes(raw)))sc=5}
    if(sc<3&&(e.hc.length>6||/[，。！？]/.test(e.hc)))sc+=2;
    if(sc<9)out.push([sc,e]);
  }
  return out.sort((x,y)=>x[0]-y[0]||x[1].id-y[1].id).map(x=>x[1]);
}

function sayWord(n){

        row.querySelectorAll('.sx').forEach(x=>{if(!x.textContent.trim())x.classList.add('empty')});
      }
      void row.offsetHeight;row.classList.toggle('open',open);tg.textContent=open?'收起例句 ▴':'看例句 ▾';
    };
    if(open&&!row.dataset.done)exLoad(fill);else fill();
    return}
  if(e.target.id==='mmore'){mlim+=30;miniDraw()}
});
document.addEventListener('click',e=>{const a=e.target.closest('[data-act=minidict]');if(a){e.preventDefault();miniOpen(true)}});
let mt=0;
// 影片視窗跟著辭典移動：先量「前」「後」兩個位置，再用 FLIP 讓影片順順滑過去
function flipVideo(change){
  const vb=document.querySelector('.vbox'),fr=vb&&vb.querySelector('iframe');
  if(!vb||!fr||matchMedia('(prefers-reduced-motion:reduce)').matches){change();return}
  const f=vb.getBoundingClientRect(),fh=fr.offsetHeight;
  change();
  const l=vb.getBoundingClientRect(),lh=fr.offsetHeight;
  if(Math.abs(f.left-l.left)<1&&Math.abs(f.top-l.top)<1&&Math.abs(fh-lh)<1)return;
  fr.style.transition=vb.style.transition='none';
  fr.style.height=fh+'px';vb.style.transform=`translate(${f.left-l.left}px,${f.top-l.top}px)`;
  void vb.offsetWidth;
  const ease='cubic-bezier(.45,.05,.2,1)';
  fr.style.transition=`height .55s ${ease}`;vb.style.transition=`transform .55s ${ease}`;
  fr.style.height=lh+'px';vb.style.transform='';
  setTimeout(()=>{fr.style.transition=vb.style.transition=fr.style.height=vb.style.transform=''},620);
}
function miniOpen(open){
  clearTimeout(mt);
  if(open){
    mini.hidden=false;void mini.offsetWidth;            // 先顯示、強制排版，transition 才會跑
    flipVideo(()=>document.body.classList.add('mini-on'));
    mini.classList.add('show');fab.classList.add('gone');
    dxLoad();miniDraw();mt=setTimeout(()=>mq.focus({preventScroll:true}),380);
  }else{
    mq.blur();mini.classList.remove('show');fab.classList.remove('gone');
    flipVideo(()=>document.body.classList.remove('mini-on'));
    mt=setTimeout(()=>{mini.hidden=true},420);
  }
}
fab.addEventListener('click',()=>miniOpen(true));
$('#mclose').addEventListener('click',()=>miniOpen(false));
mini.addEventListener('click',e=>{if(!e.target.closest('.clr'))return;const q=mini.querySelector('#mq');q.value='';q.dispatchEvent(new Event('input',{bubbles:true}));q.focus()});
mq.addEventListener('input',()=>{mlim=30;miniDraw()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mini.classList.contains('show'))miniOpen(false)});
// 台語戲台播放器：空白鍵暫停／播放（在輸入框裡打字、或焦點已在影片上時不介入）
document.addEventListener('keydown',e=>{
  if(e.code!=='Space'&&e.key!==' ')return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const v=document.getElementById('mvv');if(!v)return;
  const t=e.target;if(t===v||(t.closest&&t.closest('input,textarea,select,[contenteditable]')))return;
  e.preventDefault();
  if(v.paused)v.play().catch(()=>{});else v.pause();
});

enter(cur());render(false);
})();

// 第 8 聲符號 U+030D 在很多字型（含 Google Fonts 的 Andika 子集）會變豆腐，改用 CSS 畫
(function(){
  const re=/(\p{L})\u030D/gu;
  function fix(root){
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const hits=[];
    for(let n=w.nextNode();n;n=w.nextNode()){if(n.nodeValue.indexOf('\u030D')>=0&&!(n.parentNode.closest&&n.parentNode.closest('textarea,input,script,style')))hits.push(n)}
    hits.forEach(n=>{
      const s=n.nodeValue.normalize('NFD').normalize('NFC');const f=document.createDocumentFragment();let last=0,m;re.lastIndex=0;
      while((m=re.exec(s))){f.append(s.slice(last,m.index));const sp=document.createElement('span');sp.className='t8';sp.textContent=m[1];f.append(sp);last=m.index+m[0].length}
      f.append(s.slice(last));n.replaceWith(f)});
  }
  const mo=new MutationObserver(ms=>{ms.forEach(m=>m.addedNodes.forEach(a=>{if(a.nodeType===1)fix(a);else if(a.nodeType===3&&a.parentNode)fix(a.parentNode)}))});
  window.addEventListener('DOMContentLoaded',()=>{fix(document.body);mo.observe(document.body,{childList:true,subtree:true})});
  if(document.readyState!=='loading'){fix(document.body);mo.observe(document.body,{childList:true,subtree:true})}
})();
</script>
